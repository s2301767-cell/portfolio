<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ecclesiastes 3:1-4 Seasons</title>

<style>
body{
    background:#f4f0e6;
    text-align:center;
    font-family:Georgia, serif;
}

svg{
    background:white;
    border:4px solid #654321;
}
</style>
</head>

<body>

<h1>Ecclesiastes 3:1-4</h1>

<svg width="900" height="780">

<defs>

<path id="clockPath"
d="
M450 140
A230 230 0 1 1 449 140
"/>

</defs>

<!-- Clock -->

<circle
cx="450"
cy="350"
r="230"
fill="#fffaf0"
stroke="#654321"
stroke-width="5"/>

<!-- Path Text -->

<text
font-size="17"
font-weight="bold"
fill="#8b4513">

<textPath href="#clockPath">

TO EVERYTHING THERE IS A SEASON •
AND A TIME TO EVERY PURPOSE UNDER HEAVEN •
A TIME TO BE BORN •
A TIME TO DIE •
A TIME TO PLANT •
A TIME TO PLUCK UP THAT WHICH IS PLANTED •

</textPath>

</text>

<!-- Seasons -->

<text x="450"
y="170"
text-anchor="middle"
font-size="34"
font-weight="bold"
fill="#ff69b4">

SPRING

</text>

<text x="650"
y="360"
text-anchor="middle"
font-size="34"
font-weight="bold"
fill="#ff8c00">

SUMMER

</text>

<text x="450"
y="580"
text-anchor="middle"
font-size="34"
font-weight="bold"
fill="#a0522d">

AUTUMN

</text>

<text x="250"
y="360"
text-anchor="middle"
font-size="34"
font-weight="bold"
fill="#4169e1">

WINTER

</text>

<!-- Clock Hands -->

<line
x1="450"
y1="350"
x2="450"
y2="240"
stroke="black"
stroke-width="5"/>

<line
x1="450"
y1="350"
x2="540"
y2="400"
stroke="black"
stroke-width="5"/>

<circle
cx="450"
cy="350"
r="8"
fill="black"/>

<!-- Center Text -->

<text
x="450"
y="310"
text-anchor="middle"
font-size="40"
font-weight="bold"
fill="#4b2e05">

SEASONS

</text>

<text
x="450"
y="355"
text-anchor="middle"
font-size="24"
fill="#444">

Ecclesiastes 3:1-4

</text>

<text
x="450"
y="400"
text-anchor="middle"
font-size="20"
fill="#666">

A Time for Every Purpose

</text>

</svg>

</body>
</html>
